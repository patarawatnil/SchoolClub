<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/main}">
<head>
<title>School Club : Sign in</title>
</head>
<body>
	<div layout:fragment="content">

		<div th:if="${loginFail}" class="alert alert-danger alert-dismissible mt-3"
			role="alert">
			<button type="button" class="close" data-dismiss="alert"
				aria-label="Close">
				<span aria-hidden="true">&times;</span>
			</button>
			<span aria-hidden="true" th:text="${errorMsg}">&times;</span>
		</div>

		<div class="card mt-3 mx-auto" style="width: 18rem;">
			<div class="card-body">
				<h5 class="card-title">Sign in</h5>
				<form th:action="@{/login}" method="post" role="form" name="form1">
					<!-- email -->
					<div class="form-group">
						<label>Email Address</label> <input type="text"
							class=" form-control" name="email" id="email"
							placeholder="example@mail.com" required>
					</div>
					<!-- email -->
					<!-- psw -->
					<div class="form-group">
						<label>Password</label> <input type="password"
							class="form-control" name="password" id="password" required>
					</div>
					<!-- psw -->
					<button type="submit" class="btn btn-primary">Sign in</button>
				</form>
			</div>
		</div>

	</div>
</body>
</html>
